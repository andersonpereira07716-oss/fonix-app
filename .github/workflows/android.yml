name: Build Android APK

on:
  push:
    branches: [ principal, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependências da Web
        run: npm ci || npm install

      - name: Gerar Build da Web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Conceder permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug com Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
